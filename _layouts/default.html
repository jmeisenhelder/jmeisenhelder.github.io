<html>
<title>JeffMeisenhelder.com :: Resume :: resume@jeffmeisenhelder.com}</title>
<style>
	:root {
		--navy: #1b2a41;
		--navy-soft: #9fb3d1;
		--navy-pale: #dbe4f0;
		--accent: #4f77ab;
		--accent-pale: #eef2f8;
		--accent-border: #c9d6e8;
		--text: #2b2f36;
		--muted: #5a6472;
		--hairline: #d7dde5;
		--page-pad: 40px;
	}
	* {
		box-sizing: border-box;
	}
	body {
		max-width: 820px;
		margin: 0 auto;
		padding: var(--page-pad);
		font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		font-size: 15px;
		line-height: 1.55;
		color: var(--text);
	}
	a:is(:link, :visited, :active, :hover) {
		color: var(--navy-soft);
	}
 	a:hover {
		font-weight:bold;
	}
	a.footerlink:is(:link, :visited, :active, :hover) {
		color: var(--accent);
	}
	a.footerlink:hover {
		font-weight:bold;
	}
	div.footer {
		clear:both;
		font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		/* background-color:#000000;*/
		/* color:#FFFFFF;*/
		/*
		background-color: var(--navy);
		color:var(--accent-pale);
		*/
		background-color: var(--accent-pale);
		color:var(--navy);
		border-top-style: solid;
		border-top-color: black;
		border-top-width: 2px;
		text-align:center;
	}
	.cornerflag {
		position: fixed;
		top: 0px;
		right: 0px;
		padding: 10px 16px;
		border: 1px dotted black;
		/* background-color: #FFFFCC; */
		background-color: var(--navy-pale);
		z-index: 1002;
		text-align: center;
		color: #000000;
		white-space: nowrap;
	}
</style>
</head>
<body><div id="pdfFlag" class="cornerflag"><a href="JMeisenhelder-WEB.pdf">View this as Adobe PDF file</a></div>
{{ content }}
<div class="footer">&copy;{{ site.time | date: '%Y' }} Jeff Meisenhelder - all rights reserved. <a href="mailto:resume@jeffmeisenhelder.com" target="_blank" class="footerlink">Contact</a></div>
</body>
</html>
